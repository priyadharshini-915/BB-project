<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Request | Blood Bank Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-danger">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <span class="heart-icon">&#10084;</span> Blood Bank Management System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="blood-availability">Blood Availability</a></li>
                    <li class="nav-item"><a class="nav-link" href="donor.html">Donor Registration</a></li>
                    <li class="nav-item"><a class="nav-link active" href="blood-request.html">Blood Request</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-login.html">Admin</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white text-center">
                        <h4 class="mb-0">Blood Request Form</h4>
                    </div>
                    <div class="card-body">
                        <div id="msgBox"></div>
                        <form action="BloodRequestServlet" method="post" id="requestForm" novalidate>
                            <div class="mb-3">
                                <label class="form-label">Patient Name *</label>
                                <input type="text" name="patientName" id="patientName" class="form-control" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Blood Group *</label>
                                    <select name="bloodGroup" id="bloodGroup" class="form-select" required>
                                        <option value="">Select Blood Group</option>
                                        <option>A+</option><option>A-</option><option>B+</option>
                                        <option>B-</option><option>AB+</option><option>AB-</option>
                                        <option>O+</option><option>O-</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Required Units *</label>
                                    <input type="number" name="requiredUnits" id="requiredUnits" class="form-control" min="1" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Hospital Name *</label>
                                <input type="text" name="hospitalName" id="hospitalName" class="form-control" required>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Contact Number *</label>
                                    <input type="tel" name="contactNumber" id="contactNumber" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Request Date</label>
                                    <input type="date" name="requestDate" id="requestDate" class="form-control">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address</label>
                                <textarea name="address" id="address" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Reason</label>
                                <textarea name="reason" id="reason" class="form-control" rows="2"></textarea>
                            </div>
                            <button type="submit" class="btn btn-danger w-100">Submit Blood Request</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer bg-dark text-white pt-4 pb-3 mt-5">
        <div class="container text-center">
            <p class="mb-1">&copy; 2026 Blood Bank Management System.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
